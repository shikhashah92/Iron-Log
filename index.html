<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Iron Log</title>
<meta name="description" content="Personal strength-training exercise library and weight log.">
<meta name="theme-color" content="#a23b23">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Iron Log">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --ground:#e7e4de; --surface:#f6f4ef; --surface-2:#efece5;
    --ink:#1c1a16; --muted:#6c675d; --line:#d3cec3; --fig:#3a352c;
    --accent:#a23b23; --accent-ink:#a23b23; --accent-soft:#f0e0d8;
    --good:#3f7a34; --good-soft:#e2ecdc;
    --shadow:0 1px 2px rgba(28,26,22,.06), 0 8px 22px -12px rgba(28,26,22,.22);
    --radius:13px;
    --btnfg:#fff;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ground:#151719; --surface:#1f2224; --surface-2:#26292c;
      --ink:#ece9e2; --muted:#948f84; --line:#343a3d; --fig:#c9c3b6;
      --accent:#e2724f; --accent-ink:#e88a6c; --accent-soft:#3a2620;
      --good:#83c069; --good-soft:#28311f;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 26px -14px rgba(0,0,0,.6);
      --btnfg:#151719;
    }
  }
  :root[data-theme="dark"]{
    --ground:#151719; --surface:#1f2224; --surface-2:#26292c;
    --ink:#ece9e2; --muted:#948f84; --line:#343a3d; --fig:#c9c3b6;
    --accent:#e2724f; --accent-ink:#e88a6c; --accent-soft:#3a2620;
    --good:#83c069; --good-soft:#28311f;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 26px -14px rgba(0,0,0,.6);
    --btnfg:#151719;
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--ground); color:var(--ink);
    font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%;
  }
  .app{max-width:640px; margin:0 auto; padding:calc(16px + env(safe-area-inset-top)) 14px calc(78px + env(safe-area-inset-bottom));}
  h1,h2,h3,h4{font-family:"Barlow Condensed","Barlow Narrow",sans-serif; margin:0; letter-spacing:.02em}
  h1{font-weight:700; font-size:27px; text-transform:uppercase; line-height:1}
  h1 .mk{color:var(--accent-ink)}
  h2{font-weight:600; font-size:15px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted)}
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}

  .screen{display:none}
  .screen.active{display:block; animation:fade .18s ease}
  @keyframes fade{from{opacity:.4}to{opacity:1}}

  .apphead{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:4px}
  .screen-title{margin:2px 0 12px; display:flex; align-items:center; justify-content:space-between; gap:10px}
  .screen-title h1{font-size:22px}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:10px}
  .card.lift{box-shadow:var(--shadow)}
  .row{display:flex; align-items:center; gap:10px}
  .between{justify-content:space-between}
  .wrap-tags{display:flex; gap:5px; flex-wrap:wrap; margin-top:4px}
  .tag{font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); background:var(--surface-2); border:1px solid var(--line); padding:2px 6px; border-radius:5px}
  .tag.cst{color:var(--accent-ink); border-color:var(--accent-soft)}
  .muted{color:var(--muted)}
  .small{font-size:12.5px}
  .xs{font-size:11px}

  .btn{font:inherit; font-weight:600; font-family:"Barlow Condensed",sans-serif; text-transform:uppercase; letter-spacing:.05em; font-size:13px; padding:8px 15px; border-radius:9px; cursor:pointer; white-space:nowrap; background:var(--accent); color:var(--btnfg); border:1px solid var(--accent)}
  .btn.sm{padding:5px 10px; font-size:12px}
  .btn.ghost{background:transparent; color:var(--accent-ink); border-color:var(--line)}
  .btn.ghost:hover{border-color:var(--accent)}
  .btn.dim{background:transparent; color:var(--muted); border-color:var(--line)}
  .btn:disabled{opacity:.4; cursor:default}
  .iconbtn{font:inherit; font-size:15px; line-height:1; background:transparent; border:1px solid var(--line); color:var(--muted); width:30px; height:28px; border-radius:8px; cursor:pointer; padding:0; display:inline-flex; align-items:center; justify-content:center}

  input,select,textarea{font:inherit; background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:9px; padding:8px 10px}
  input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,.chip:focus-visible{outline:2px solid var(--accent); outline-offset:1px; border-color:transparent}
  input::placeholder,textarea::placeholder{color:var(--muted)}
  .field{width:100%; margin-top:4px}
  label.lbl{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin-top:10px; font-weight:600}

  .search{width:100%; margin:2px 0 10px}
  .chips{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto; font:inherit; font-size:12px; font-weight:600; font-family:"Barlow Condensed",sans-serif; text-transform:uppercase; letter-spacing:.05em; padding:5px 11px; border-radius:999px; cursor:pointer; background:var(--surface); color:var(--muted); border:1px solid var(--line)}
  .chip[aria-pressed="true"]{background:var(--accent); color:var(--btnfg); border-color:var(--accent)}

  .ex-row{display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center; padding:11px 4px; border-bottom:1px solid var(--line); cursor:pointer}
  .ex-row:last-child{border-bottom:0}
  .ex-row .nm{font-family:"Barlow Condensed",sans-serif; font-weight:600; font-size:17px; line-height:1.15}
  .ex-row .last{font-size:11px; color:var(--muted); text-align:right; white-space:nowrap}
  .ex-row .last b{color:var(--ink); font-weight:500}
  .thumb{width:38px; height:38px; border-radius:8px; object-fit:cover; border:1px solid var(--line); flex:0 0 auto; background:var(--surface-2)}
  .favstar{background:transparent; border:0; cursor:pointer; font-size:19px; line-height:1; padding:2px; color:var(--line); flex:0 0 auto}
  .favstar.on{color:var(--accent)}
  .group-head{font-family:"Barlow Condensed",sans-serif; text-transform:uppercase; letter-spacing:.09em; font-size:12px; font-weight:600; color:var(--muted); margin:16px 2px 4px; display:flex; align-items:center; gap:8px}
  .group-head::after{content:""; flex:1; height:1px; background:var(--line)}

  .exphoto{width:100%; max-height:280px; object-fit:cover; border-radius:11px; border:1px solid var(--line); display:block; background:var(--surface-2)}
  .ph-actions{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px}

  .cues{display:grid; gap:11px; margin-top:12px}
  @media (min-width:520px){.cues{grid-template-columns:1fr 1fr 1fr}}
  .cue h4{font-size:11px; text-transform:uppercase; letter-spacing:.08em; font-weight:600; margin-bottom:3px}
  .cue.s h4{color:var(--ink)} .cue.e h4{color:var(--accent-ink)} .cue.a h4{color:var(--muted)}
  .cue ul{margin:0; padding-left:15px; display:grid; gap:3px}
  .cue li{font-size:12.5px; line-height:1.42; color:var(--ink)}
  .cue.a li{color:var(--muted)}

  .wk-ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:12px 12px 8px; margin-bottom:10px}
  .set-table{width:100%; border-collapse:collapse; margin:6px 0 2px}
  .set-table th{font:600 10px/1 "Barlow Condensed",sans-serif; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); text-align:left; padding:0 6px 5px}
  .set-table td{padding:3px 6px}
  .set-table td:first-child{width:26px; color:var(--muted); font-family:"IBM Plex Mono",monospace; font-size:12px}
  .set-table input{width:100%; padding:6px 7px; font-family:"IBM Plex Mono",monospace; text-align:center}
  .set-table .del{width:26px}
  .set-table .del button{border:0; background:transparent; color:var(--muted); cursor:pointer; font-size:15px; padding:2px 4px}
  .set-table .del button:hover{color:var(--accent-ink)}
  .wk-actions{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px}
  .pr-tag{font-family:"IBM Plex Mono",monospace; font-size:10px; color:var(--muted); border:1px solid var(--line); border-radius:5px; padding:1px 5px}
  .pr-tag.hit{color:var(--good); border-color:var(--good); background:var(--good-soft)}

  .seg{display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; margin-bottom:12px}
  .seg button{font:inherit; font-family:"Barlow Condensed",sans-serif; text-transform:uppercase; letter-spacing:.06em; font-size:12px; font-weight:600; padding:6px 14px; border:0; background:transparent; color:var(--muted); cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--accent); color:var(--btnfg)}
  .sess{background:var(--surface); border:1px solid var(--line); border-radius:11px; padding:11px 12px; margin-bottom:8px}
  .sess summary{list-style:none; cursor:pointer; display:flex; align-items:baseline; justify-content:space-between; gap:8px}
  .sess summary::-webkit-details-marker{display:none}
  .sess .sd{font-family:"Barlow Condensed",sans-serif; font-weight:600; font-size:16px}
  .sess .meta{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--muted)}
  .line{display:grid; grid-template-columns:1fr auto; gap:10px; font-size:12.5px; padding:5px 0; border-top:1px solid var(--line)}
  .line .sv{font-family:"IBM Plex Mono",monospace; color:var(--muted); text-align:right}
  .spark{display:block; height:22px; width:70px; color:var(--accent-ink)}
  .chart{width:100%; height:auto; color:var(--accent-ink); margin:8px 0}
  .stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:10px 0}
  .stat{background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:9px 10px}
  .stat .k{font-size:10px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); font-weight:600}
  .stat .v{font-family:"IBM Plex Mono",monospace; font-size:18px; margin-top:2px}

  .tabbar{position:fixed; left:0; right:0; bottom:0; z-index:15; background:var(--surface); border-top:1px solid var(--line); display:flex; max-width:640px; margin:0 auto; padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabbar button{flex:1; background:transparent; border:0; cursor:pointer; padding:5px 2px; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--muted); font:600 10px/1 "Barlow Condensed",sans-serif; text-transform:uppercase; letter-spacing:.05em}
  .tabbar button svg{width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.8}
  .tabbar button[aria-current="true"]{color:var(--accent-ink)}

  .modal{position:fixed; inset:0; z-index:40; display:none}
  .modal.open{display:block}
  .modal .veil{position:absolute; inset:0; background:rgba(0,0,0,.42)}
  .sheet{position:absolute; left:0; right:0; bottom:0; max-width:640px; margin:0 auto; background:var(--ground); border-radius:16px 16px 0 0; border:1px solid var(--line); max-height:92vh; overflow:auto; padding:14px 14px calc(20px + env(safe-area-inset-bottom))}
  .sheet-head{display:flex; align-items:center; justify-content:space-between; gap:10px; position:sticky; top:0; background:var(--ground); padding-bottom:8px; margin-bottom:4px}
  .sheet-head h3{font-size:19px; font-weight:600}

  .timer{position:fixed; left:0; right:0; bottom:calc(70px + env(safe-area-inset-bottom)); z-index:18; background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); display:none; align-items:center; gap:10px; padding:9px 12px; max-width:612px; margin:0 auto}
  .timer.show{display:flex}
  .timer .clock{font-family:"IBM Plex Mono",monospace; font-size:23px; font-variant-numeric:tabular-nums; min-width:64px}
  .timer.done .clock{color:var(--good)}
  .timer .lbl{font:600 11px "Barlow Condensed",sans-serif; text-transform:uppercase; letter-spacing:.08em; color:var(--muted)}
  .timer .tb{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:12px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink); width:32px; height:30px; border-radius:8px; cursor:pointer; padding:0}
  .timer .tb.skip{margin-left:auto; width:auto; padding:0 12px; color:var(--muted)}

  .toast{position:fixed; left:50%; transform:translateX(-50%); bottom:130px; z-index:50; background:var(--ink); color:var(--ground); font-size:12.5px; padding:8px 14px; border-radius:8px; opacity:0; transition:opacity .2s; pointer-events:none; max-width:88vw; text-align:center}
  .toast.show{opacity:.96}
  .empty{color:var(--muted); font-size:13px; font-style:italic; padding:6px 2px}
  .sync{font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--muted); margin-top:14px; display:flex; align-items:center; gap:6px}
  .sync .dot{width:6px; height:6px; border-radius:50%; background:var(--muted)}
  .sync.on .dot{background:var(--good)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}

  .signin{position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; padding:24px; background:var(--ground)}
  .signin-card{max-width:340px; width:100%; text-align:center}
  .signin-card h1{font-size:32px; margin-bottom:6px}
  .signin-card p{color:var(--muted); font-size:13.5px; margin:0 0 22px}
  .g-btn{
    display:inline-flex; align-items:center; justify-content:center; gap:10px; width:100%;
    background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:10px;
    padding:11px 16px; font:600 14px "Barlow",sans-serif; cursor:pointer;
  }
  .g-btn:hover{border-color:var(--accent)}
  .signin-note{margin-top:16px; font-size:11.5px; color:var(--muted)}
  .account-row{display:flex; align-items:center; gap:8px; margin-top:14px}
  .account-row img{width:22px; height:22px; border-radius:50%}
</style>
</head>
<body>

<div class="signin" id="signin">
  <div class="signin-card">
    <h1><span class="mk" style="color:var(--accent-ink)">Iron</span> Log</h1>
    <p>Sign in with Google to sync your workouts across every device.</p>
    <button class="g-btn" id="googleSignIn" type="button">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.98A9 9 0 0 0 0 9c0 1.45.35 2.83.98 4.03l2.97-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .98 4.97l2.97 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
      Continue with Google
    </button>
    <p class="signin-note">Your workout data is private to your Google account and stored in your own Firebase project.</p>
  </div>
</div>

<div id="appRoot" style="display:none">
<div class="app">
  <section class="screen" data-screen="home"></section>
  <section class="screen" data-screen="exercises"></section>
  <section class="screen" data-screen="workout"></section>
  <section class="screen" data-screen="history"></section>
  <div class="sync" id="sync"><span class="dot"></span><span id="syncText">Saved on this device</span></div>
</div>

<nav class="tabbar" id="tabbar">
  <button data-act="nav" data-screen="home" aria-current="true"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Home</button>
  <button data-act="nav" data-screen="exercises"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Exercises</button>
  <button data-act="nav" data-screen="workout"><svg viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M4 9l2-2M9 4l-2 2M20 15l-2 2M15 20l2-2M2 12l3 3M12 2l3 3M19 9l3 3M9 19l3 3"/></svg>Workout</button>
  <button data-act="nav" data-screen="history"><svg viewBox="0 0 24 24"><path d="M4 20V6M10 20V4M16 20v-8M22 20H2"/></svg>History</button>
</nav>

<div class="timer" id="timer">
  <span class="lbl">Rest</span><span class="clock" id="clock">1:30</span>
  <button class="tb" id="tMinus" aria-label="minus 15s">−15</button>
  <button class="tb" id="tPlus" aria-label="plus 15s">+15</button>
  <button class="tb skip" id="tSkip">Done</button>
</div>

<div class="modal" id="modal"><div class="veil" data-act="close"></div><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept="image/*" hidden>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
/* ============ EXERCISE LIBRARY ============ */
/* weightType: barbell | dumbbell | machine | cable | bodyweight   (drives the weight field)
   pattern: key into POSE for the form diagram
   hold / bg (optional): override the pattern's default implement / backdrop for this exercise */
const EX = [
 // ---- CHEST ----
 {id:"bench-press-bb",name:"Barbell Bench Press",group:"Chest",equip:"Barbell",weightType:"barbell",pattern:"pressFlat",
  setup:["Eyes under the bar; shoulder blades pinched back and down.","Feet flat and driven into the floor; small natural arch.","Grip a little wider than shoulder width, wrists stacked over elbows."],
  exec:["Unrack to over the shoulders; lower under control to the lower-chest / nipple line.","Keep elbows tucked ~45-75 degrees; touch lightly.","Press up and slightly back toward the face; keep the upper back tight."],
  avoid:["Flaring elbows out to 90 degrees.","Bouncing the bar off the chest.","Hips lifting off the bench / losing upper-back tightness."]},
 {id:"incline-barbell-press",name:"Incline Barbell Press",group:"Chest",equip:"Barbell",weightType:"barbell",pattern:"pressIncline",hold:"barbell",
  setup:["Bench at about 30 degrees.","Grip just outside shoulder width, wrists stacked over elbows.","Shoulder blades retracted, feet planted."],
  exec:["Unrack and lower under control to the upper chest / collarbone.","Press up and slightly back; don't let it drift toward the face."],
  avoid:["Setting the bench too steep - it becomes a shoulder press.","Bouncing the bar off the chest.","Flaring the elbows out to 90 degrees."]},
 {id:"incline-db-press",name:"Incline Dumbbell Press",group:"Chest",equip:"Dumbbell",weightType:"dumbbell",pattern:"pressIncline",
  setup:["Bench at about 30 degrees.","Sit back with the dumbbells on your thighs, then kick them to shoulder level as you lie back.","Shoulder blades retracted, wrists over elbows."],
  exec:["Press up and slightly together without clashing the bells.","Lower until the elbows are just below shoulder level; feel the upper-chest stretch."],
  avoid:["Setting the bench too steep - it becomes a shoulder press.","Letting the wrists bend back.","Clanking the dumbbells together at the top."]},
 {id:"flat-db-press",name:"Dumbbell Bench Press",group:"Chest",equip:"Dumbbell",weightType:"dumbbell",pattern:"pressFlat",
  setup:["Lie flat, dumbbells over the lower chest.","Shoulder blades retracted and 'set', feet planted."],
  exec:["Lower with elbows ~45 degrees until level with the torso.","Press up in a slight arc until the arms are nearly straight."],
  avoid:["Over-lowering past a comfortable shoulder stretch.","Bridging the hips up.","Pushing the weights toward the head."]},
 {id:"machine-chest-press",name:"Chest Press Machine",group:"Chest",equip:"Machine",weightType:"machine",pattern:"pressFlat",
  setup:["Set the seat so the handles line up with mid-chest.","Back and head against the pad, blades pulled back."],
  exec:["Press smoothly to near-lockout.","Return under control until the hands are level with the chest."],
  avoid:["Seat too low (handles at the neck) or too high (at the belly).","Shrugging the shoulders up to press.","Letting the stack slam down."]},
 {id:"pec-deck",name:"Pec Deck / Machine Fly",group:"Chest",equip:"Machine",weightType:"machine",pattern:"fly",
  setup:["Seat height so the forearms meet the pads at mid-chest with a soft elbow bend.","Back flat on the pad, feet planted."],
  exec:["Bring the pads together in a hugging arc; squeeze for a beat.","Return slowly to a comfortable chest stretch."],
  avoid:["Yanking with straight, locked arms.","Overstretching the arms behind the torso.","Rounding the shoulders forward at the finish."]},
 {id:"cable-fly",name:"Cable Chest Fly",group:"Chest",equip:"Cable",weightType:"cable",pattern:"fly",
  setup:["Pulleys set high, staggered stance, slight forward lean from the hips.","Soft, fixed elbow bend held throughout."],
  exec:["Sweep the handles down and together in front of the hips / navel.","Cross the hands slightly, squeeze, return slowly to a stretch."],
  avoid:["Bending and extending the elbows (turns it into a press).","Standing bolt upright.","Using so much weight it pulls you backward."]},
 {id:"push-up",name:"Push-Ups",group:"Chest",equip:"Bodyweight",weightType:"bodyweight",pattern:"plank",

    profUnsub.push(db.collection("templates").onSnapshot(function(s){

  function putTemplate(id,patch){

/* ---- image capture: downscale to a small JPEG data URI so it fits a synced document ---- */
function processImage(file,cb){
  if(!file) return;
  if(file.type==="image/gif"){
    if(file.size>230000){toast("That GIF is too large (keep it under ~220 KB)");return;}
    const r=new FileReader(); r.onload=function(){cb(r.result);}; r.readAsDataURL(file); return;
  }
  const reader=new FileReader();
  reader.onload=function(){
    const img=new Image();
    img.onload=function(){
      const max=560; let w=img.width,h=img.height;
      const sc=Math.min(1,max/Math.max(w,h)); w=Math.round(w*sc); h=Math.round(h*sc);
      const c=document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      let q=0.75, out=c.toDataURL("image/jpeg",q);
      while(out.length>230000 && q>0.35){ q-=0.1; out=c.toDataURL("image/jpeg",q); }
      cb(out);
    };
    img.onerror=function(){toast("Couldn't read that image");};
    img.src=reader.result;
  };
  reader.onerror=function(){toast("Couldn't read that file");};
  reader.readAsDataURL(file);
}

/* ============ QUERIES ============ */
function sessionsOf(exId){return Object.keys(logs).map(k=>logs[k]).filter(e=>e.exerciseId===exId&&e.sets.length).sort((a,b)=>a.date<b.date?-1:1);}
function lastSessionOf(exId,beforeDate){const s=sessionsOf(exId).filter(e=>!beforeDate||e.date<beforeDate);return s[s.length-1]||null;}
function bestSet(sets){return sets.slice().sort((a,b)=>(b.w||0)-(a.w||0)||(b.r||0)-(a.r||0))[0];}
function prOf(exId){let m=0;sessionsOf(exId).forEach(e=>e.sets.forEach(s=>{if((s.w||0)>m)m=s.w||0;}));return m;}
function topLoad(e,ex){
  const bw=prefs.bw||0;
  return e.sets.reduce(function(m,s){
    let v=s.w||0;
    if(ex.weightType==="bodyweight") v=bw>0?bw+(s.w||0):(s.w||0);
    return Math.max(m,v);
  },0);
}
function volumeOf(e,ex){
  const bw=prefs.bw||0;
  return e.sets.reduce(function(t,s){
    const r=s.r||0; let w=s.w||0;
    if(ex.metric==="secs") return t;
    if(ex.weightType==="bodyweight"){const base=bw>0?bw+w:w;return t+Math.max(0,base)*r;}
    if(ex.weightType==="dumbbell") return t+w*r*2;
    return t+w*r;
  },0);
}
function fmtSet(s,ex){
  const rep=ex.metric==="secs"?(s.r+"s"):s.r;
  const w=s.w;
  if(ex.weightType==="bodyweight"){
    if(!w) return "BW×"+rep;
    return "BW"+(w>0?"+":"")+num(w)+"×"+rep;
  }
  if(!w) return rep+(ex.metric==="secs"?"":" reps");
  const u=ex.weightType==="dumbbell"?"/DB":"";
  return num(w)+u+"×"+rep;
}
function dateRange(days){const out=[];const d=new Date(today()+"T00:00:00");for(let i=0;i<days;i++){out.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"));d.setDate(d.getDate()-1);}return out;}

/* ============ small svg charts ============ */
function sparkOf(exId){
  const ex=getEx(exId);
  const pts=sessionsOf(exId).map(e=>topLoad(e,ex)).filter(v=>v>0).slice(-12);
  if(pts.length<2)return "";
  const w=70,h=22,p=3,mn=Math.min.apply(0,pts),mx=Math.max.apply(0,pts),rg=(mx-mn)||1;
  const c=pts.map((v,i)=>(p+i*(w-2*p)/(pts.length-1)).toFixed(1)+","+(h-p-(v-mn)/rg*(h-2*p)).toFixed(1));
  const l=c[c.length-1].split(",");
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" aria-hidden="true"><polyline points="'+c.join(" ")+'" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="'+l[0]+'" cy="'+l[1]+'" r="1.8" fill="currentColor"/></svg>';
}
function lineChart(series){
  if(series.length<2) return '<p class="empty">Log this exercise at least twice to see a trend.</p>';
  const W=300,H=118,pl=6,pr=26,pt2=10,pb=18;
  const vals=series.map(s=>s.val),mn=Math.min.apply(0,vals),mx=Math.max.apply(0,vals);
  const lo=mn-(mx-mn)*.15||mn*.9,hi=mx+(mx-mn)*.15||mx*1.1+1,rg=(hi-lo)||1;
  const X=i=>pl+i*(W-pl-pr)/(series.length-1), Y=v=>pt2+(1-(v-lo)/rg)*(H-pt2-pb);
  const pl2=series.map((s,i)=>X(i).toFixed(1)+","+Y(s.val).toFixed(1));
  const area="M"+X(0).toFixed(1)+","+(H-pb)+" L"+pl2.join(" L ")+" L"+X(series.length-1).toFixed(1)+","+(H-pb)+" Z";
  const dots=series.map((s,i)=>'<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(s.val).toFixed(1)+'" r="2.4" fill="currentColor"/>').join("");
  const last=series[series.length-1];
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="progress chart">'+
    '<path d="'+area+'" fill="var(--accent-soft)" opacity=".55"/>'+
    '<polyline points="'+pl2.join(" ")+'" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>'+dots+
    '<text x="'+(W-pr+3)+'" y="'+(Y(mx)+3).toFixed(1)+'" font-size="9" fill="var(--muted)">'+num(mx)+'</text>'+
    '<text x="'+(W-pr+3)+'" y="'+(Y(mn)+3).toFixed(1)+'" font-size="9" fill="var(--muted)">'+num(mn)+'</text>'+
    '<text x="'+pl+'" y="'+(H-4)+'" font-size="9" fill="var(--muted)">'+series[0].label+'</text>'+
    '<text x="'+(W-pr)+'" y="'+(H-4)+'" font-size="9" fill="var(--muted)" text-anchor="end">'+last.label+'</text>'+
    '</svg>';
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

    }).join("")+'</div>':
    '<div class="card"><h2>★ Favorites</h2><p class="empty">Tap the star (☆) on any exercise in the Exercises tab to pin the ones you use regularly here.</p></div>';

  const lastByEx={};
  Object.keys(logs).forEach(k=>{const e=logs[k];if(!e.sets.length)return;if(!lastByEx[e.exerciseId]||e.date>lastByEx[e.exerciseId])lastByEx[e.exerciseId]=e.date;});
  const recent=Object.keys(lastByEx).sort((a,b)=>lastByEx[b]<lastByEx[a]?-1:1).slice(0,6);
  const recentCard=recent.length?

        '<div class="last">'+(s?fdate(s.date)+' · <b>'+fmtSet(b,ex)+'</b>':'—')+
        '<br><button class="btn ghost sm" style="margin-top:4px" data-act="log-now" data-id="'+id+'">+ Log</button></div></div>';
    }).join("")+'</div>':
    '<div class="card"><h2>Recently used</h2><p class="empty">Your recent exercises will show up here once you start logging.</p></div>';

  return '<div class="apphead"><h1><span class="mk">Iron</span> Log</h1>'+
    '<span class="row" style="gap:6px"><button class="btn ghost sm" data-act="open-profiles" title="Switch profile">'+esc(profileName(currentProfileId))+'</button>'+
    '<button class="iconbtn" data-act="theme" title="Theme">◐</button>'+
    '<button class="iconbtn" data-act="signout" title="Sign out">⏻</button></span></div>'+
    '<div class="stat-grid">'+
      '<div class="stat"><div class="k">This week</div><div class="v">'+wkSess+'<span class="xs muted"> sess</span></div></div>'+
      '<div class="stat"><div class="k">Sets</div><div class="v">'+wkSets+'</div></div>'+
      '<div class="stat"><div class="k">Volume</div><div class="v">'+(wkVol>=1000?num(wkVol/1000)+"t":num(wkVol))+'</div></div>'+
    '</div>'+
    todayCard+favCard+recentCard+
    '<div class="card"><div class="row between"><span class="small muted">Bodyweight (for volume &amp; 1RM estimates)</span>'+
    '<span><input id="bwInput" class="mono" style="width:78px;text-align:center" inputmode="decimal" value="'+(prefs.bw||"")+'" placeholder="kg"> <span class="xs muted">kg</span></span></div></div>';

/* ---- EXERCISES ---- */
screens.exercises=function(){
  const q=(prefs._exq||"").toLowerCase();
  const g=prefs.group;
  let items=allEx().slice();
  if(g==="Custom") items=items.filter(e=>custom[e.id]);
  else if(g==="Favorites") items=items.filter(e=>favs[e.id]);
  else if(g!=="All") items=items.filter(e=>e.group===g);
  if(q) items=items.filter(e=>e.name.toLowerCase().indexOf(q)>-1||(e.equip||"").toLowerCase().indexOf(q)>-1);
  items.sort((a,b)=>a.name<b.name?-1:1);

  const chips=["All"].concat(Object.keys(favs).length?["Favorites"]:[]).concat(GROUPS).concat(Object.keys(custom).length?["Custom"]:[])
    .map(c=>'<button class="chip" data-act="grp" data-g="'+c+'" aria-pressed="'+(g===c)+'">'+(c==="Favorites"?"★ Favorites":c)+'</button>').join("");

  let body;
  if(!items.length) body='<p class="empty">No exercises match.</p>';
  else if(q||g!=="All") body=items.map(exRow).join("");
  else body=GROUPS.map(grp=>{
    const inG=items.filter(e=>e.group===grp); if(!inG.length)return "";
    return '<div class="group-head">'+grp+'</div>'+inG.map(exRow).join("");
  }).join("")+ (Object.keys(custom).length?'<div class="group-head">Custom</div>'+items.filter(e=>custom[e.id]).map(exRow).join(""):"");

  return '<div class="screen-title"><h1>Exercises</h1><button class="btn sm" data-act="open-add">+ Add exercise</button></div>'+
    '<input class="search" id="exSearch" type="search" placeholder="Search '+allEx().length+' exercises…" autocomplete="off" value="'+esc(prefs._exq||"")+'">'+
    '<div class="chips" style="margin-bottom:6px">'+chips+'</div>'+
    '<div class="card" style="padding:4px 12px">'+body+'</div>';
};
function exRow(ex){
  const s=lastSessionOf(ex.id); const b=s?bestSet(s.sets):null;
  const on=!!favs[ex.id];
  return '<div class="ex-row" data-act="open-detail" data-id="'+ex.id+'"><div style="display:flex;gap:7px;align-items:center;min-width:0">'+
    '<button class="favstar'+(on?" on":"")+'" data-act="toggle-fav" data-id="'+ex.id+'" aria-label="'+(on?"Remove from":"Add to")+' favorites" aria-pressed="'+on+'">'+(on?"★":"☆")+'</button>'+
    (imgs[ex.id]?'<img class="thumb" src="'+imgs[ex.id].img+'" alt="">':'')+
    '<div style="min-width:0"><div class="nm">'+esc(ex.name)+(custom[ex.id]?' <span class="tag cst">Custom</span>':'')+'</div>'+
    '<div class="wrap-tags"><span class="tag">'+esc(ex.group)+'</span><span class="tag">'+esc(ex.equip||"—")+'</span></div></div></div>'+
    '<div class="last">'+(s?fdate(s.date)+'<br><b>'+fmtSet(b,ex)+'</b>':'no log')+' '+sparkOf(ex.id)+'</div></div>';
}

/* ---- WORKOUT ---- */
function workoutExIds(date){
  const fromSess=(sess[date]&&sess[date].exerciseIds)||[];
  const fromLogs=Object.keys(logs).filter(k=>logs[k].date===date&&logs[k].sets.length).map(k=>logs[k].exerciseId);
  const set=[]; fromSess.concat(fromLogs).forEach(id=>{if(set.indexOf(id)<0)set.push(id);});
  return set;
}
screens.workout=function(){
  const iso=today();
  const ids=workoutExIds(iso);
  let vol=0,setct=0;
  ids.forEach(id=>{const e=logs[iso+"_"+id];if(e){setct+=e.sets.length;vol+=volumeOf(e,getEx(id));}});
  const s=sess[iso];
  let timerRow;
  if(!s||!s.startedAt){
    timerRow='<button class="btn" style="width:100%;margin-bottom:10px" data-act="start-workout">▶ Start Workout</button>';
  } else if(!s.endedAt){
    timerRow='<div class="card lift row between" style="margin-bottom:10px"><span class="mono" id="wkTimer" style="font-size:22px">'+fmtDuration(Date.now()-s.startedAt)+'</span>'+
      '<button class="btn dim sm" data-act="end-workout">■ End Workout</button></div>';
  } else {
    timerRow='<div class="row between" style="margin-bottom:10px"><span class="xs muted">Finished in '+fmtDuration(s.endedAt-s.startedAt)+(s.feeling?' · felt '+esc(s.feeling):'')+'</span>'+
      '<button class="btn ghost sm" data-act="start-workout">↻ Start again</button></div>';
  }
  const head='<div class="screen-title"><h1>Workout</h1><span class="mono xs muted">'+fdatefull(iso)+'</span></div>'+
    timerRow+
    '<div class="row between" style="margin-bottom:10px"><span class="small muted">'+ids.length+' exercises · '+setct+' sets · '+num(vol)+' kg</span>'+
    '<span class="row" style="gap:6px"><button class="btn ghost sm" data-act="open-templates">Templates</button>'+
    '<button class="btn sm" data-act="open-picker">+ Add exercise</button></span></div>';
  if(!ids.length){
    const tIds=Object.keys(templates);
    const tButtons=tIds.length?'<div class="wk-actions" style="margin-top:10px">'+tIds.map(tid=>
      '<button class="btn ghost sm" data-act="start-template" data-id="'+tid+'">▶ '+esc(templates[tid].name)+'</button>').join("")+'</div>':"";
    return head+'<div class="card"><p class="empty">No exercises yet. Tap “+ Add exercise” to build today’s session'+(tIds.length?", or start a template below:":", or start one from Home / Recently used.")+'</p>'+tButtons+'</div>';
  }
  return head+ids.map(id=>wkCard(id,iso)).join("");
};
function wkCard(id,iso){
  const ex=getEx(id);
  const docId=iso+"_"+id;
  const e=logs[docId]||{exerciseId:id,date:iso,sets:[]};
  const pr=prOf(id);
  const todayMax=e.sets.reduce((m,s)=>Math.max(m,s.w||0),0);
  const prHit=pr>0&&todayMax>=pr;
  const wLabel=ex.weightType==="bodyweight"?"±kg":(ex.weightType==="dumbbell"?"kg/DB":"kg");
  const rLabel=ex.metric==="secs"?"secs":"reps";
  const rows=e.sets.map((s,i)=>
    '<tr><td>'+(i+1)+'</td>'+
    '<td><input inputmode="decimal" data-act="setw" data-id="'+id+'" data-i="'+i+'" value="'+(s.w?s.w:"")+'" aria-label="weight"></td>'+
    '<td><input inputmode="numeric" data-act="setr" data-id="'+id+'" data-i="'+i+'" value="'+(s.r||"")+'" aria-label="'+rLabel+'"></td>'+
    '<td class="del"><button data-act="delset" data-id="'+id+'" data-i="'+i+'" aria-label="delete set">×</button></td></tr>').join("");
  const prev=lastSessionOf(id,iso);
  return '<div class="wk-ex"><div class="row between"><div><b style="font-family:\'Barlow Condensed\',sans-serif;font-size:18px">'+esc(ex.name)+'</b>'+
    ' <span class="pr-tag'+(prHit?" hit":"")+'">'+(pr>0?"PR "+num(pr):"no PR")+'</span></div>'+
    '<button class="iconbtn" data-act="rm-wk" data-id="'+id+'" aria-label="remove exercise">×</button></div>'+
    '<div class="xs muted" style="margin-top:2px">'+esc(ex.equip||"")+' · enter '+WT_LABEL[ex.weightType]+
      (prev?' · last: '+prev.sets.map(x=>fmtSet(x,ex)).join(", "):"")+'</div>'+
    '<table class="set-table"><thead><tr><th></th><th>'+wLabel+'</th><th>'+rLabel+'</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '<div class="wk-actions"><button class="btn ghost sm" data-act="addset" data-id="'+id+'">+ Set</button>'+
    (prev?'<button class="btn dim sm" data-act="repeat" data-id="'+id+'">Repeat last ('+prev.sets.length+')</button>':'')+
    '<button class="btn dim sm" data-act="open-detail" data-id="'+id+'">Form</button></div></div>';
}

/* ---- HISTORY ---- */
screens.history=function(){
  const tab=prefs.histTab;
  const seg='<div class="seg"><button data-act="htab" data-t="sessions" aria-pressed="'+(tab==="sessions")+'">Sessions</button>'+
    '<button data-act="htab" data-t="progress" aria-pressed="'+(tab==="progress")+'">Progress</button></div>';
  if(tab==="progress") return '<div class="screen-title"><h1>History</h1></div>'+seg+progressView();

  const byDate={};
  Object.keys(logs).forEach(k=>{const e=logs[k];if(!e.sets.length)return;(byDate[e.date]=byDate[e.date]||[]).push(e);});
  const dates=Object.keys(byDate).sort().reverse();
  if(!dates.length) return '<div class="screen-title"><h1>History</h1></div>'+seg+'<div class="card"><p class="empty">No sessions logged yet.</p></div>';
  return '<div class="screen-title"><h1>History</h1></div>'+seg+dates.map(d=>{
    const es=byDate[d]; let vol=0,sets=0;
    es.forEach(e=>{vol+=volumeOf(e,getEx(e.exerciseId));sets+=e.sets.length;});
    const ds=sess[d];
    const durMeta=(ds&&ds.startedAt&&ds.endedAt)?(" · "+fmtDuration(ds.endedAt-ds.startedAt)+(ds.feeling?" · "+esc(ds.feeling):"")):"";
    return '<details class="sess"'+(d===today()?" open":"")+'><summary><span class="sd">'+fdatefull(d)+
      ' <span class="xs muted mono">'+(daysAgo(d)===0?"today":daysAgo(d)+"d ago")+'</span></span>'+
      '<span class="meta">'+es.length+" ex · "+sets+" sets · "+num(vol)+" kg"+durMeta+"</span></summary>"+
      es.map(e=>{const ex=getEx(e.exerciseId);return '<div class="line"><span>'+esc(ex.name)+'</span><span class="sv">'+e.sets.map(s=>fmtSet(s,ex)).join("  ")+'</span></div>';}).join("")+
      '</details>';
  }).join("");
};
function estOneRM(s,ex){
  let e1rm=0;
  s.forEach(e=>e.sets.forEach(st=>{const base=ex.weightType==="bodyweight"?((prefs.bw||0)+(st.w||0)):(st.w||0);const est=base*(1+(st.r||0)/30);if(est>e1rm)e1rm=est;}));
  return e1rm;
}
function progressView(){
  const logged=Object.keys(logs).reduce((a,k)=>{const id=logs[k].exerciseId;if(logs[k].sets.length&&a.indexOf(id)<0)a.push(id);return a;},[]);
  if(!logged.length) return '<div class="card"><p class="empty">Log a few sessions first, then pick an exercise here to see its progress.</p></div>';
  let id=prefs.progressEx; if(logged.indexOf(id)<0) id=logged[0];
  const ex=getEx(id);
  const s=sessionsOf(id);
  const series=s.map(e=>({label:fdate(e.date),val:topLoad(e,ex)})).filter(x=>x.val>0);
  const pr=prOf(id);
  const e1rm=estOneRM(s,ex);
  const opts=logged.map(x=>{const g=getEx(x);return '<option value="'+x+'"'+(x===id?" selected":"")+'>'+esc(g.name)+'</option>';}).join("");
  return '<div class="card"><select id="progSel" class="field" style="width:100%">'+opts+'</select>'+
    '<div class="stat-grid">'+
      '<div class="stat"><div class="k">Sessions</div><div class="v">'+s.length+'</div></div>'+
      '<div class="stat"><div class="k">Best load</div><div class="v">'+num(pr)+'</div></div>'+
      '<div class="stat"><div class="k">Est. 1RM</div><div class="v">'+num(e1rm)+'</div></div>'+
    '</div>'+
    lineChart(series)+
    '<div class="xs muted" style="margin-bottom:6px">'+(ex.weightType==="dumbbell"?"Values are per-dumbbell. ":"")+
      (ex.weightType==="bodyweight"?(prefs.bw?"Bodyweight "+num(prefs.bw)+" kg included.":"Set your bodyweight on Home for loaded estimates."):"")+
      ' Est. 1RM uses the Epley formula.</div>'+
    s.slice().reverse().slice(0,10).map(e=>'<div class="line"><span>'+fdatefull(e.date)+'</span><span class="sv">'+e.sets.map(x=>fmtSet(x,ex)).join("  ")+'</span></div>').join("")+
    '</div>';
}

    '<p class="xs muted" style="margin-bottom:10px">Optional - helps you spot when you\'re overreaching or coasting.</p>'+
    '<div class="wk-actions" style="flex-wrap:wrap">'+opts.map(o=>
      '<button class="btn ghost" data-act="finish-workout" data-feel="'+o[1]+'" style="flex:1 1 42%">'+o[0]+' '+o[1]+'</button>').join("")+'</div>'+
    '<button class="btn dim" style="width:100%;margin-top:10px" data-act="finish-workout" data-feel="">Skip</button>';
}
function templatesHTML(){
  const ids=Object.keys(templates);
  const rows = ids.length ? ids.map(id=>{
    const t=templates[id];
    return '<div class="ex-row"><div><div class="nm">'+esc(t.name)+'</div><div class="xs muted">'+t.exerciseIds.length+' exercise'+(t.exerciseIds.length!==1?"s":"")+'</div></div>'+
      '<div class="last" style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">'+
      '<button class="btn ghost sm" data-act="start-template" data-id="'+id+'">Start</button>'+
      '<button class="btn dim sm" data-act="edit-template" data-id="'+id+'">Edit</button>'+
      '<button class="btn dim sm" data-act="del-template" data-id="'+id+'">Delete</button></div></div>';
  }).join("") : '<p class="empty">No templates yet. Build one once - e.g. "Leg Day" with your usual 7 exercises - then start it with one tap on workout day.</p>';
  return '<div class="sheet-head"><h3>Templates</h3><button class="iconbtn" data-act="close">×</button></div>'+
    '<div class="card" style="padding:2px 12px">'+rows+'</div>'+
    '<button class="btn" style="width:100%;margin-top:10px" data-act="add-template">+ New template</button>';
}
function templateEditHTML(id){
  const t=templates[id]; if(!t) return '<p class="empty">Template not found.</p>';
  const rows = t.exerciseIds.length ? t.exerciseIds.map(exid=>{
    const ex=getEx(exid);
    return '<div class="ex-row"><div><div class="nm">'+esc(ex.name)+'</div><div class="xs muted">'+esc(ex.group)+' · '+esc(ex.equip||"—")+'</div></div>'+
      '<div class="last"><button class="btn dim sm" data-act="tmpl-rm-ex" data-tid="'+id+'" data-id="'+exid+'">Remove</button></div></div>';
  }).join("") : '<p class="empty">No exercises yet - tap "+ Add exercise" below to build this template.</p>';
  return '<div class="sheet-head"><h3>'+esc(t.name)+'</h3><button class="iconbtn" data-act="close">×</button></div>'+
    '<div class="wk-actions" style="margin-bottom:10px"><button class="btn ghost sm" data-act="rename-template" data-id="'+id+'">Rename</button>'+
    '<button class="btn dim sm" data-act="open-templates">All templates</button></div>'+
    '<div class="card" style="padding:2px 12px">'+rows+'</div>'+
    '<button class="btn" style="width:100%;margin-top:10px" data-act="tmpl-add-ex" data-id="'+id+'">+ Add exercise</button>';
}
function profilesHTML(){
  const ids=Object.keys(profiles);
  const rows=ids.map(id=>{
    const active=id===currentProfileId;
    return '<div class="ex-row"><div><div class="nm">'+esc(profileName(id))+(active?' <span class="tag cst">Current</span>':'')+'</div></div>'+
      '<div class="last" style="display:flex;gap:6px">'+
      (active?'':'<button class="btn ghost sm" data-act="switch-profile" data-id="'+id+'">Switch</button>')+
      '<button class="btn dim sm" data-act="rename-profile" data-id="'+id+'">Rename</button>'+
      (ids.length>1?'<button class="btn dim sm" data-act="del-profile" data-id="'+id+'">Delete</button>':'')+
      '</div></div>';
  }).join("");
  return '<div class="sheet-head"><h3>Profiles</h3><button class="iconbtn" data-act="close">×</button></div>'+
    '<p class="xs muted" style="margin-bottom:10px">Switch between people sharing this account - each profile has its own separate exercises, workouts and history.</p>'+
    '<div class="card" style="padding:2px 12px">'+rows+'</div>'+
    '<button class="btn" style="width:100%;margin-top:10px" data-act="add-profile">+ New profile</button>';
}

/* ============ ACTIONS ============ */
function addToWorkout(id){
  const iso=today();
  const s=sess[iso]||{date:iso,exerciseIds:[],ts:Date.now()};
  if(s.exerciseIds.indexOf(id)<0)s.exerciseIds.push(id);
  s.ts=Date.now(); putSess(iso,s);
}
function removeFromWorkout(id){
  const iso=today();
  const s=sess[iso]||{date:iso,exerciseIds:[],ts:Date.now()};
  s.exerciseIds=s.exerciseIds.filter(x=>x!==id); putSess(iso,s);
  if(logs[iso+"_"+id]) dropLog(iso+"_"+id);
}
function startWorkout(){
  const iso=today();
  const s=sess[iso]||{date:iso,exerciseIds:[],ts:Date.now()};
  s.startedAt=Date.now(); delete s.endedAt; delete s.feeling;
  s.ts=Date.now(); putSess(iso,s); render();
}
function endWorkout(feeling){
  const iso=today();
  const s=sess[iso]||{date:iso,exerciseIds:[],ts:Date.now()};
  if(!s.startedAt) s.startedAt=Date.now();
  s.endedAt=Date.now();
  if(feeling) s.feeling=feeling; else delete s.feeling;
  s.ts=Date.now(); putSess(iso,s); render();
}
function addSet(id){
  const iso=today(), docId=iso+"_"+id;
  const e=logs[docId]||{exerciseId:id,date:iso,sets:[]};
  const prev=e.sets[e.sets.length-1]||lastPrevSet(id);
  e.sets=e.sets.concat([{w:prev?prev.w:0,r:prev?prev.r:0}]);
  e.ts=Date.now(); putLog(docId,e); addToWorkout(id);
}
function lastPrevSet(id){const p=lastSessionOf(id,today());return p?p.sets[p.sets.length-1]:null;}
function updateSet(id,i,field,raw){
  const iso=today(), docId=iso+"_"+id;
  const e=logs[docId]; if(!e||!e.sets[i])return;
  const v=raw.trim();
  if(field==="w") e.sets[i].w = v===""?0:parseFloat(v);
  else e.sets[i].r = v===""?0:parseInt(v,10);
  if(!Number.isFinite(e.sets[i].w)) e.sets[i].w=0;
  if(!Number.isFinite(e.sets[i].r)) e.sets[i].r=0;
  e.ts=Date.now(); putLog(docId,e);
}
function delSet(id,i){
  const iso=today(), docId=iso+"_"+id;
  const e=logs[docId]; if(!e)return;
  e.sets.splice(i,1);
  if(e.sets.length){e.ts=Date.now();putLog(docId,e);} else dropLog(docId);
}
function repeatLast(id){
  const prev=lastSessionOf(id,today()); if(!prev)return;
  const iso=today(), docId=iso+"_"+id;
  const e=logs[docId]||{exerciseId:id,date:iso,sets:[]};
  e.sets=e.sets.concat(prev.sets.map(s=>({w:s.w||0,r:s.r||0})));
  e.ts=Date.now(); putLog(docId,e); addToWorkout(id);
  toast("Copied "+prev.sets.length+" set"+(prev.sets.length>1?"s":"")+" from "+fdate(prev.date));
}
function saveExFromForm(){
  const name=document.getElementById("axName").value.trim();
  if(!name){toast("Give the exercise a name");return;}
  const lines=v=>v.split("\n").map(x=>x.trim()).filter(Boolean);
  const id=editId||("u_"+Date.now().toString(36));
  const e={id:id,name:name,
    group:document.getElementById("axGroup").value,
    equip:document.getElementById("axEquip").value.trim()||"Other",
    weightType:document.getElementById("axWt").value,
    metric:document.getElementById("axMetric").value,
    pattern:(editId&&custom[editId]&&custom[editId].pattern)||"neutral",
    setup:lines(document.getElementById("axSetup").value),
    exec:lines(document.getElementById("axExec").value),
    avoid:lines(document.getElementById("axAvoid").value),
    ts:Date.now()};
  putCustom(e); closeModal(); prefs.group="Custom"; savePrefs(); go("exercises");
  toast(editId?"Exercise updated":"Exercise added");
}

/* ============ EVENTS ============ */
document.addEventListener("click",function(ev){
  const t=ev.target.closest("[data-act]"); if(!t)return;
  const a=t.getAttribute("data-act"), id=t.getAttribute("data-id");
  switch(a){
    case "nav": go(t.getAttribute("data-screen")); break;
    case "go-workout": go("workout"); break;
    case "theme":
      prefs.theme = prefs.theme==="auto"?"light":prefs.theme==="light"?"dark":"auto";
      savePrefs(); applyTheme(); toast("Theme: "+prefs.theme); break;
    case "signout":
      if(window.firebase && firebase.apps.length && confirm("Sign out of Iron Log?")) firebase.auth().signOut();
      break;
    case "open-profiles": modalMode="profiles"; openModal(profilesHTML()); break;
    case "switch-profile":
      if(window.__ironlogProfiles){ window.__ironlogProfiles.select(id); closeModal(); }
      break;
    case "rename-profile": {
      if(!window.__ironlogProfiles) break;
      const nm=prompt("Rename profile",profileName(id));
      if(nm&&nm.trim()){ window.__ironlogProfiles.put(id,{name:nm.trim()}); openModal(profilesHTML()); }
      break; }
    case "del-profile":
      if(!window.__ironlogProfiles) break;
      if(Object.keys(profiles).length<=1){ toast("You need at least one profile"); break; }
      if(confirm("Delete the profile \""+profileName(id)+"\"? This removes its logged history too.")){
        const wasCurrent=id===currentProfileId;
        window.__ironlogProfiles.del(id);
        if(wasCurrent){ const rest=Object.keys(profiles).filter(x=>x!==id); if(rest.length) window.__ironlogProfiles.select(rest[0]); }
        openModal(profilesHTML());
      }
      break;
    case "add-profile": {
      if(!window.__ironlogProfiles) break;
      const nm=prompt("New profile name (e.g. a family member's name)");
      if(nm&&nm.trim()){ const nid=window.__ironlogProfiles.add(nm.trim()); window.__ironlogProfiles.select(nid); closeModal(); }
      break; }
    case "grp": prefs.group=t.getAttribute("data-g"); savePrefs(); render(); break;
    case "open-detail": modalMode="detail"; openModal(detailHTML(id)); break;
    case "close": closeModal(); break;
    case "open-add": editId=null; modalMode="add"; openModal(addExHTML(null)); break;
    case "edit-ex": editId=id; modalMode="add"; openModal(addExHTML(custom[id])); break;
    case "save-ex": saveExFromForm(); break;
    case "del-ex":
      if(confirm("Delete this custom exercise? Its logged history stays in History.")){ delCustom(id); closeModal(); render(); }
      break;
    case "add-to-workout": addToWorkout(id); closeModal(); go("workout"); toast("Added to today’s workout"); break;
    case "log-now": addToWorkout(id); go("workout"); break;
    case "open-picker": pickerCtx={q:"",mode:"workout"}; modalMode="picker"; openModal(pickerHTML()); break;
    case "pick":
      if(pickerCtx && pickerCtx.mode==="template"){ templateAddEx(pickerCtx.templateId,id); openModal(pickerHTML()); }
      else { addToWorkout(id); closeModal(); go("workout"); }
      break;
    case "open-templates": modalMode="templates"; openModal(templatesHTML()); break;
    case "add-template": {
      const nm=prompt("Template name (e.g. Leg Day)");
      if(nm&&nm.trim()&&window.__ironlogTemplates){ const tid=window.__ironlogTemplates.add(nm.trim()); modalMode="template-edit"; openModal(templateEditHTML(tid)); }
      break; }
    case "edit-template": modalMode="template-edit"; openModal(templateEditHTML(id)); break;
    case "rename-template": {
      if(!window.__ironlogTemplates) break;
      const nm=prompt("Rename template",(templates[id]&&templates[id].name)||"");
      if(nm&&nm.trim()){ window.__ironlogTemplates.put(id,{name:nm.trim()}); openModal(templateEditHTML(id)); }
      break; }
    case "del-template":
      if(!window.__ironlogTemplates) break;
      if(confirm("Delete the template \""+((templates[id]&&templates[id].name)||"")+"\"? This won't affect any workouts you've already logged.")){
        window.__ironlogTemplates.del(id); openModal(templatesHTML());
      }
      break;
    case "start-template": startTemplate(id); closeModal(); break;
    case "tmpl-add-ex": pickerCtx={q:"",mode:"template",templateId:id}; modalMode="picker"; openModal(pickerHTML()); break;
    case "tmpl-rm-ex": {
      const tid=t.getAttribute("data-tid");
      templateRemoveEx(tid,id);
      openModal(templateEditHTML(tid));
      break; }
    case "rm-wk": if(confirm("Remove "+getEx(id).name+" from today?")){ removeFromWorkout(id); render(); } break;
    case "start-workout": startWorkout(); break;
    case "end-workout": modalMode="feeling"; openModal(feelingHTML()); break;
    case "finish-workout": endWorkout(t.getAttribute("data-feel")); closeModal(); break;
    case "addset": addSet(id); render(); focusLastWeight(id); break;
    case "delset": delSet(id, +t.getAttribute("data-i")); render(); break;
    case "repeat": repeatLast(id); render(); break;
    case "htab": prefs.histTab=t.getAttribute("data-t"); savePrefs(); render(); break;
    case "pick-photo": pendingPhotoId=id; document.getElementById("fileInput").click(); break;
    case "del-photo": if(confirm("Remove this photo?")){ delImg(id); if(modalMode==="detail") openModal(detailHTML(id)); render(); } break;
    case "toggle-fav":
      toggleFav(id);
      if(modalMode==="detail") openModal(detailHTML(id));
      render();
      break;
  }
});
document.addEventListener("change",function(ev){
  const t=ev.target;
  if(t.id==="bwInput"){ prefs.bw=parseFloat(t.value)||0; savePrefs(); render(); return; }
  if(t.id==="progSel"){ prefs.progressEx=t.value; savePrefs(); render(); return; }
  const act=t.getAttribute&&t.getAttribute("data-act");
  if(act==="setw"||act==="setr"){
    updateSet(t.getAttribute("data-id"), +t.getAttribute("data-i"), act==="setw"?"w":"r", t.value);
  }
});
document.addEventListener("change",function(ev){
  const act=ev.target.getAttribute&&ev.target.getAttribute("data-act");
  if(act==="setr" && ev.target.value.trim()!=="") startTimer();
},true);
document.addEventListener("input",function(ev){
  const t=ev.target;
  if(t.id==="exSearch"){ prefs._exq=t.value; clearTimeout(t._d); t._d=setTimeout(()=>{const p=document.activeElement===t;render();if(p){const n=document.getElementById("exSearch");if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length);}}},180); }
  if(t.id==="pkSearch"){ pickerCtx.q=t.value; clearTimeout(t._d); t._d=setTimeout(()=>{openModal(pickerHTML());const n=document.getElementById("pkSearch");if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length);}},180); }
});
document.addEventListener("keydown",function(ev){
  if(ev.key==="Enter" && ev.target.getAttribute && ev.target.getAttribute("data-act")==="setr"){
    ev.preventDefault();
    const id=ev.target.getAttribute("data-id");
    updateSet(id,+ev.target.getAttribute("data-i"),"r",ev.target.value);
    addSet(id); render(); focusLastWeight(id);
  }
  if(ev.key==="Escape" && modal.classList.contains("open")) closeModal();
});
function focusLastWeight(id){
  const rows=document.querySelectorAll('.wk-ex input[data-act="setw"][data-id="'+id+'"]');
  if(rows.length){ const n=rows[rows.length-1]; n.focus(); }
}

/* ============ ROUTER / RENDER ============ */
function go(name){ prefs.screen=name; savePrefs(); render(); window.scrollTo(0,0); }
function render(){
  const name=prefs.screen||"home";
  document.querySelectorAll(".screen").forEach(s=>{
    const on=s.getAttribute("data-screen")===name;
    s.classList.toggle("active",on);
    if(on) s.innerHTML=screens[name]();
  });
  document.querySelectorAll("#tabbar button").forEach(b=>b.setAttribute("aria-current", b.getAttribute("data-screen")===name?"true":"false"));
  syncWkTimer();
}

/* live "time elapsed" readout while a workout is in progress - updates its own
   span directly so it never disrupts focus/typing in the set-entry inputs */
let wkTimerHandle=null;
function syncWkTimer(){
  clearInterval(wkTimerHandle); wkTimerHandle=null;
  const s=sess[today()];
  const el=document.getElementById("wkTimer");
  if(!el||!s||!s.startedAt||s.endedAt) return;
  const tick=function(){ const e=document.getElementById("wkTimer"); if(e) e.textContent=fmtDuration(Date.now()-s.startedAt); };
  wkTimerHandle=setInterval(tick,1000);
}

/* ============ THEME ============ */
function applyTheme(){
  if(prefs.theme==="auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",prefs.theme);
}

/* ============ REST TIMER ============ */
const timerEl=document.getElementById("timer"), clockEl=document.getElementById("clock");
let tRem=0,tH=null;
function fmtC(s){return s<=0?"0:00":Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
function startTimer(){
  if(!prefs.rest)return;
  tRem=prefs.rest; timerEl.classList.add("show"); timerEl.classList.remove("done"); clockEl.textContent=fmtC(tRem);
  clearInterval(tH);
  tH=setInterval(function(){
    tRem--; clockEl.textContent=fmtC(tRem);
    if(tRem<=0){clearInterval(tH);timerEl.classList.add("done");if(navigator.vibrate){try{navigator.vibrate([120,60,120]);}catch(e){}}setTimeout(()=>timerEl.classList.remove("show"),4000);}
  },1000);
}
document.getElementById("tMinus").onclick=()=>{tRem=Math.max(0,tRem-15);clockEl.textContent=fmtC(tRem);};
document.getElementById("tPlus").onclick=()=>{tRem+=15;clockEl.textContent=fmtC(tRem);timerEl.classList.remove("done");};
document.getElementById("tSkip").onclick=()=>{clearInterval(tH);timerEl.classList.remove("show");};

/* ============ MISC ============ */
function setSync(on,txt){const el=document.getElementById("sync");el.classList.toggle("on",!!on);document.getElementById("syncText").textContent=txt;}
let toastH=null;
function toast(m){const el=document.getElementById("toast");el.textContent=m;el.classList.add("show");clearTimeout(toastH);toastH=setTimeout(()=>el.classList.remove("show"),2400);}

/* ============ BOOT ============ */
applyTheme();
if(["home","exercises","workout","history"].indexOf(prefs.screen)<0) prefs.screen="home";
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
</script>

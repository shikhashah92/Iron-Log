<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- GitHub Pages can't send headers, so the content security policy lives here. Nothing may load or connect
         anywhere but this site: no third-party requests, no inline scripts. (frame-ancestors only works as a header.) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'" />
    <meta name="description" content="Uplift: a private, offline-first training log. Your data stays on your phone." />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Uplift" />
    <!-- "default", not black-translucent: translucent shifts the installed iPhone app down and leaves a dead strip at the bottom. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F7F5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1D2125" />
    <!-- Relative paths: the app can also be served from a sub-folder, and every route is one level deep. -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      /* Fonts are self-hosted: no request ever leaves for a font service. */
      /* Archivo (OFL), the brand's one family: a variable font, every weight in one file (latin). */
      @font-face { font-family: "Archivo"; font-weight: 100 900; font-display: swap; src: url(fonts/Archivo-latin.woff2) format("woff2"); }
      html, body { height: 100%; }
      body {
        overflow: hidden;
        background: #F7F7F5;
        overscroll-behavior: none; /* no rubber-band / pull-to-refresh in the installed app */
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }
      * { touch-action: manipulation; } /* no double-tap zoom delay */
      input:focus, textarea:focus { outline: none; } /* fields show focus with their own border */
      @media (prefers-color-scheme: dark) { body { background: #1D2125; } }
      /* Pinned to the viewport edges so nothing can scroll the app shell itself. */
      #root { display: flex; position: fixed; inset: 0; }
      /* The launch splash (brand kit, 2.8 s, holds on its last frame). It's plain HTML so it shows before any script
         runs; the app fades it out once the animation has played and the data has loaded (src/app/_layout.tsx). */
      #splash { position: fixed; inset: 0; z-index: 10; background: #FFFFFF; transition: opacity 0.3s ease; }
      #splash img { width: 100%; height: 100%; object-fit: cover; display: block; }
      #splash.out { opacity: 0; pointer-events: none; }
      @media (prefers-color-scheme: dark) { #splash { background: #1D2125; } }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <div id="splash"><picture><source srcset="splash/dark.svg" media="(prefers-color-scheme: dark)" /><img src="splash/light.svg" alt="Uplift" /></picture></div>
  </body>
</html>

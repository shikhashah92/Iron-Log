<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Uplift: a private, offline-first strength-training log. Your data stays on your phone." />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Uplift" />
    <!-- "default", not black-translucent: translucent shifts the installed iPhone app down and leaves a dead strip at the bottom. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e7e4de" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#151719" />
    <!-- Relative paths: the app is can also be served from a sub-folder, and every route is one level deep. -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      /* Fonts are self-hosted: no request ever leaves for a font service. */
      @font-face { font-family: "Barlow Condensed"; font-weight: 600; font-display: swap; src: url(fonts/BarlowCondensed-600.woff2) format("woff2"); }
      @font-face { font-family: "Barlow Condensed"; font-weight: 700; font-display: swap; src: url(fonts/BarlowCondensed-700.woff2) format("woff2"); }
      @font-face { font-family: "IBM Plex Mono"; font-weight: 400; font-display: swap; src: url(fonts/IBMPlexMono-400.woff2) format("woff2"); }
      @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: swap; src: url(fonts/IBMPlexMono-500.woff2) format("woff2"); }
      html, body { height: 100%; }
      body {
        overflow: hidden;
        background: #e7e4de;
        overscroll-behavior: none; /* no rubber-band / pull-to-refresh in the installed app */
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }
      * { touch-action: manipulation; } /* no double-tap zoom delay */
      input:focus, textarea:focus { outline: none; } /* fields show focus with their own border */
      @media (prefers-color-scheme: dark) { body { background: #151719; } }
      /* Pinned to the viewport edges so nothing can scroll the app shell itself. */
      #root { display: flex; position: fixed; inset: 0; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>

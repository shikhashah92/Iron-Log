<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid slice"><style>
.all{transform-box:view-box;transform-origin:540px 900px;animation:hold 2.8s linear 1 both}
